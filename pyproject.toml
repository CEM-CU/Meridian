[project]
name = "meridian"
version = "0.1.0"
description = "Meridian — C-Suite Decision Intelligence Tool"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "rich>=14.3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "pymupdf>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.22",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits real (cheap) LLM — run manually, not in CI",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/scenarios/*.py" = ["E501", "RUF001", "RUF003"]
"tests/e2e/*.py" = ["E501", "TC002", "TC003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
